name: santas_gift_rush
description: A 60-second Christmas factory sorting game.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.35.1
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - data/game_config.v1.json
    - data/shifts.v1.json
    - assets/backgrounds/
    - assets/characters/
    - assets/audio/
    - assets/transitions/
    - assets/factory/conveyor/
    - assets/factory/decor/
    - assets/factory/machines/
    - assets/gifts/
    - assets/gifts/texas/
    - assets/gifts/silicon_valley/
    - assets/gifts/great_lakes/
    - assets/ui/buttons/
    - assets/ui/effects/
    - assets/ui/hud/
    - assets/ui/icons/
    - assets/ui/panels/
